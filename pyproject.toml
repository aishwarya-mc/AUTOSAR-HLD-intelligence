[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "dist", "submission_assets", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "E702", "B905"]  # long lines tolerated in tables; FastAPI Depends() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
"app/evaluation/*" = ["E402"]
"scripts/*" = ["E402"]
