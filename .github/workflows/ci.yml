name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest -q
      - name: Evaluation (extraction, validation, Q&A, independent set)
        run: |
          python -m app.evaluation.extraction_eval
          python -m app.evaluation.validation_eval
          python -m app.evaluation.run_eval
        env:
          GIT_SHA: ${{ github.sha }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t autosar-hld:ci .
      - name: Smoke test
        run: |
          docker run -d --name hld -p 8000:8000 autosar-hld:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break || sleep 2; done
          curl -fs localhost:8000/version
