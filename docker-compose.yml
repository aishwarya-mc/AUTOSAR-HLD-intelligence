services:
  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////srv/data/db/autosar.db
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
    ports:
      - "8000:8000"
    volumes:
      - hld-data:/srv/data/db
      - hld-uploads:/srv/data/uploads
      - hld-vectors:/srv/data/vectorstore
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      retries: 5
    restart: unless-stopped

  ui:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501",
              "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hld-data:
  hld-uploads:
  hld-vectors:
